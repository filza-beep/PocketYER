
name: Build Pocket YER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -iname 'PocketYER-project.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -iname '*.zip' | head -n 1)
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan!"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "extracted" ]; then
            PROJECT_DIR=$(find extracted -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n 1 | xargs dirname)
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project located at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketYER-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
