
name: Build Pocket YER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan di repository."
            exit 1
          fi
          echo "ZIP ditemukan: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          echo "Isi hasil ekstrak:"
          find extracted -maxdepth 4 -type f | head -80
          SETTINGS=$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan dalam ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project Android ditemukan di: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketYER-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
